<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cucu-Run</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b132b; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial Black', sans-serif; }
        canvas { border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.9); }
    </style>
</head>
<body>

<script>
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;

const config = {
    type: Phaser.AUTO,
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { 
            gravity: { y: 2200 }, 
            debug: false 
        }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let cucurella;
let suelo;
let obstaculos;
let coleccionables;
let timerObstaculos;
let timerColeccionables;
let timerDificultad;
let score = 0;
let highScore = 0;
let contadorCopas = 0;
let modoFiesta = false;
let lucesFiesta;

let textoPuntos;
let textoBest;
let textoNivel;
let textoCopas;
let textoSuperCucu;
let tweenSuperCucu;
let gameOver = false;

// Doble Salto
let saltosRestantes = 2;

// Variables de Velocidad Progresiva
let velocidadObstaculos = 280;
let velocidadColeccionables = 230;
let retrasoSpawns = 1650;
let multiplicadorVelocidad = 1.0;

// Generador de Sonidos Sintetizados (Web Audio API)
const AudioFX = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    },
    salto() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    },
    item() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    },
    powerUp() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    },
    pitido() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(2800, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }
};

function preload() {
    highScore = parseInt(localStorage.getItem('cucu_highscore') || '0');

    // 1. CUCURELLA
    let canvasCucu = this.textures.createCanvas('cucurella', 64, 84);
    let ctxC = canvasCucu.context;
    
    ctxC.fillStyle = '#1c100b';
    ctxC.beginPath(); ctxC.arc(32, 24, 25, 0, Math.PI * 2); ctxC.fill();
    ctxC.beginPath(); ctxC.arc(12, 32, 16, 0, Math.PI * 2); ctxC.fill();
    ctxC.beginPath(); ctxC.arc(52, 32, 16, 0, Math.PI * 2); ctxC.fill();
    ctxC.beginPath(); ctxC.arc(18, 16, 12, 0, Math.PI * 2); ctxC.fill();
    ctxC.beginPath(); ctxC.arc(46, 16, 12, 0, Math.PI * 2); ctxC.fill();

    ctxC.fillStyle = '#f3c193';
    ctxC.fillRect(20, 22, 24, 22);

    ctxC.fillStyle = '#ffffff';
    ctxC.fillRect(24, 28, 6, 6);
    ctxC.fillRect(34, 28, 6, 6);
    ctxC.fillStyle = '#000000';
    ctxC.fillRect(26, 30, 3, 3);
    ctxC.fillRect(36, 30, 3, 3);

    ctxC.fillStyle = '#1c100b';
    ctxC.fillRect(26, 38, 12, 3);

    ctxC.fillStyle = '#dc2626';
    ctxC.fillRect(16, 44, 32, 22);
    ctxC.fillStyle = '#facc15';
    ctxC.fillRect(16, 44, 4, 22);
    ctxC.fillRect(44, 44, 4, 22);

    ctxC.fillStyle = '#1e3a8a';
    ctxC.fillRect(16, 66, 32, 14);

    ctxC.fillStyle = '#ffffff';
    ctxC.fillRect(16, 80, 12, 4);
    ctxC.fillRect(36, 80, 12, 4);
    canvasCucu.refresh();

    // 2. ÁRBITRO
    let canvasArbitro = this.textures.createCanvas('arbitro', 52, 72);
    let ctxA = canvasArbitro.context;
    ctxA.fillStyle = '#f5d0a9';
    ctxA.beginPath(); ctxA.arc(22, 14, 10, 0, Math.PI * 2); ctxA.fill();
    ctxA.fillStyle = '#0f172a';
    ctxA.beginPath(); ctxA.arc(22, 10, 10, Math.PI, Math.PI * 2); ctxA.fill();
    ctxA.fillStyle = '#eab308';
    ctxA.fillRect(8, 24, 28, 24);
    ctxA.fillStyle = '#0f172a';
    ctxA.fillRect(14, 24, 6, 24);
    ctxA.fillRect(26, 24, 6, 24);
    ctxA.fillStyle = '#f5d0a9';
    ctxA.fillRect(36, 12, 6, 18);
    ctxA.fillStyle = '#dc2626';
    ctxA.fillRect(34, 0, 14, 20);
    ctxA.fillStyle = '#0f172a';
    ctxA.fillRect(8, 48, 28, 14);
    ctxA.fillStyle = '#ffffff';
    ctxA.fillRect(8, 62, 10, 10);
    ctxA.fillRect(26, 62, 10, 10);
    canvasArbitro.refresh();

    // 3. RIVALES ARGENTINA
    const PEINADOS = ['calvo', 'rubio', 'tupe', 'rizado'];
    PEINADOS.forEach(tipo => {
        let canvasR = this.textures.createCanvas('rival_' + tipo, 48, 68);
        let ctxR = canvasR.context;

        ctxR.fillStyle = '#f5d0a9';
        ctxR.beginPath(); ctxR.arc(24, 14, 11, 0, Math.PI * 2); ctxR.fill();

        if (tipo === 'calvo') {
            ctxR.fillStyle = '#ffffff';
            ctxR.beginPath(); ctxR.arc(20, 9, 3, 0, Math.PI * 2); ctxR.fill();
        } else if (tipo === 'rubio') {
            ctxR.fillStyle = '#facc15';
            ctxR.beginPath(); ctxR.arc(24, 10, 11, Math.PI, Math.PI * 2); ctxR.fill();
        } else if (tipo === 'tupe') {
            ctxR.fillStyle = '#27272a';
            ctxR.fillRect(14, 3, 20, 10);
        } else if (tipo === 'rizado') {
            ctxR.fillStyle = '#78350f';
            ctxR.beginPath(); ctxR.arc(16, 9, 7, 0, Math.PI * 2); ctxR.fill();
            ctxR.beginPath(); ctxR.arc(24, 7, 7, 0, Math.PI * 2); ctxR.fill();
            ctxR.beginPath(); ctxR.arc(32, 9, 7, 0, Math.PI * 2); ctxR.fill();
        }

        ctxR.fillStyle = '#ffffff';
        ctxR.fillRect(8, 25, 32, 26);
        ctxR.fillStyle = '#0284c7';
        ctxR.fillRect(8, 25, 8, 26);
        ctxR.fillRect(24, 25, 8, 26);

        ctxR.fillStyle = '#0f172a';
        ctxR.fillRect(8, 51, 32, 14);

        ctxR.fillStyle = '#ffffff';
        ctxR.fillRect(8, 65, 12, 3);
        ctxR.fillRect(28, 65, 12, 3);

        canvasR.refresh();
    });

    // 4. BOTELLÍN DE CERVEZA
    let canvasCerveza = this.textures.createCanvas('cerveza', 28, 48);
    let ctxCer = canvasCerveza.context;
    ctxCer.fillStyle = '#92400e';
    ctxCer.fillRect(8, 18, 12, 28);
    ctxCer.fillRect(11, 4, 6, 14);
    ctxCer.fillStyle = '#dc2626';
    ctxCer.fillRect(10, 0, 8, 4);
    ctxCer.fillStyle = '#fef08a';
    ctxCer.fillRect(8, 26, 12, 12);
    canvasCerveza.refresh();

    // 5. PIZZA
    let canvasPizza = this.textures.createCanvas('pizza', 42, 42);
    let ctxPz = canvasPizza.context;
    ctxPz.fillStyle = '#d97706';
    ctxPz.beginPath(); ctxPz.moveTo(21, 4); ctxPz.lineTo(38, 38); ctxPz.lineTo(4, 38); ctxPz.closePath(); ctxPz.fill();
    ctxPz.fillStyle = '#facc15';
    ctxPz.beginPath(); ctxPz.moveTo(21, 10); ctxPz.lineTo(34, 35); ctxPz.lineTo(8, 35); ctxPz.closePath(); ctxPz.fill();
    ctxPz.fillStyle = '#dc2626';
    ctxPz.beginPath(); ctxPz.arc(21, 22, 4, 0, Math.PI * 2); ctxPz.fill();
    ctxPz.beginPath(); ctxPz.arc(15, 30, 3, 0, Math.PI * 2); ctxPz.fill();
    ctxPz.beginPath(); ctxPz.arc(27, 30, 3, 0, Math.PI * 2); ctxPz.fill();
    canvasPizza.refresh();

    // 6. COPA DEL MUNDO
    let canvasCopa = this.textures.createCanvas('copa', 36, 50);
    let ctxCop = canvasCopa.context;
    ctxCop.fillStyle = '#eab308';
    ctxCop.fillRect(8, 40, 20, 8);
    ctxCop.fillRect(12, 24, 12, 16);
    ctxCop.beginPath(); ctxCop.arc(18, 15, 13, 0, Math.PI * 2); ctxCop.fill();
    ctxCop.fillStyle = '#166534';
    ctxCop.fillRect(8, 43, 20, 3);
    canvasCopa.refresh();

    // 7. SUELO DE CÉSPED
    let canvasSuelo = this.textures.createCanvas('suelo', GAME_WIDTH, 70);
    let ctxS = canvasSuelo.context;
    ctxS.fillStyle = '#15803d';
    ctxS.fillRect(0, 0, GAME_WIDTH, 70);
    ctxS.fillStyle = '#ffffff';
    ctxS.fillRect(0, 0, GAME_WIDTH, 6);
    canvasSuelo.refresh();

    // 8. TEXTURA PARTÍCULA HIERBA
    let canvasHierba = this.textures.createCanvas('p_hierba', 6, 6);
    let ctxH = canvasHierba.context;
    ctxH.fillStyle = '#4ade80';
    ctxH.fillRect(0, 0, 6, 6);
    canvasHierba.refresh();
}

function create() {
    let bg = this.add.graphics();
    
    // Cielo
    bg.fillStyle(0x0f172a, 1);
    bg.fillRect(0, 0, GAME_WIDTH, 180);

    // Luces Estadio
    bg.fillStyle(0xfef08a, 0.2);
    bg.fillTriangle(40, 0, 0, 220, 150, 220);
    bg.fillTriangle(GAME_WIDTH - 40, 0, GAME_WIDTH, 220, GAME_WIDTH - 150, 220);

    bg.fillStyle(0xffffff, 0.9);
    bg.fillRect(30, 10, 40, 12);
    bg.fillRect(GAME_WIDTH - 70, 10, 40, 12);

    // Gradas
    let coloresPublico = [0xdc2626, 0xef4444, 0xfacc15, 0x1d4ed8, 0xffffff, 0x475569];
    let altoFila = 12;

    for (let yGrada = 80; yGrada < 220; yGrada += altoFila) {
        bg.fillStyle(0x334155, 1);
        bg.fillRect(0, yGrada, GAME_WIDTH, 3);

        for (let xG = 6; xG < GAME_WIDTH; xG += 9) {
            let colorRandom = coloresPublico[Math.floor(Math.random() * coloresPublico.length)];
            bg.fillStyle(colorRandom, 0.85);
            bg.fillRect(xG, yGrada - 7, 6, 7);
            bg.fillStyle(0xf3c193, 0.85);
            bg.fillRect(xG + 1, yGrada - 10, 4, 3);
        }
    }

    // Capa de Luces de Fiesta (Oculta por defecto)
    lucesFiesta = this.add.graphics();
    lucesFiesta.setDepth(10);
    lucesFiesta.setVisible(false);

    // Valla Publicitaria
    bg.fillStyle(0x1e293b, 1);
    bg.fillRect(0, 215, GAME_WIDTH, 15);
    bg.fillStyle(0x3b82f6, 1);
    bg.fillRect(0, 220, GAME_WIDTH, 5);

    // Césped
    let altFranja = 50;
    for (let y = 230; y < GAME_HEIGHT - 70; y += altFranja) {
        let esClaro = (Math.floor(y / altFranja)) % 2 === 0;
        bg.fillStyle(esClaro ? 0x16a34a : 0x15803d, 1);
        bg.fillRect(0, y, GAME_WIDTH, altFranja);
    }

    // Suelo
    suelo = this.physics.add.staticGroup();
    let plataforma = suelo.create(GAME_WIDTH / 2, GAME_HEIGHT - 35, 'suelo');
    plataforma.setDisplaySize(GAME_WIDTH, 70).refreshBody();

    // Cucurella
    cucurella = this.physics.add.sprite(80, GAME_HEIGHT - 120, 'cucurella');
    cucurella.setCollideWorldBounds(true);
    cucurella.body.setSize(30, 62);
    cucurella.body.setOffset(17, 18);
    this.physics.add.collider(cucurella, suelo, function() {
        saltosRestantes = 2;
    });

    // Grupos
    obstaculos = this.physics.add.group();
    coleccionables = this.physics.add.group();

    this.physics.add.overlap(cucurella, obstaculos, chocar, null, this);
    this.physics.add.overlap(cucurella, coleccionables, recogerColeccionable, null, this);

    // Timers
    timerObstaculos = this.time.addEvent({
        delay: retrasoSpawns,
        callback: crearObstaculo,
        callbackScope: this,
        loop: true
    });

    timerColeccionables = this.time.addEvent({
        delay: 1900,
        callback: crearColeccionable,
        callbackScope: this,
        loop: true
    });

    timerDificultad = this.time.addEvent({
        delay: 9000,
        callback: incrementarDificultad,
        callbackScope: this,
        loop: true
    });

    // Control Táctil
    this.input.on('pointerdown', function () {
        AudioFX.init();

        if (!gameOver) {
            if (saltosRestantes > 0) {
                cucurella.setVelocityY(-780);
                saltosRestantes--;
                AudioFX.salto();
                generarEfectoHierba(cucurella.x, cucurella.y + 35, this);
            }
        } else {
            location.reload();
        }
    }, this);

    // Marcador
    let marco = this.add.graphics();
    marco.fillStyle(0x020617, 0.9);
    marco.fillRoundedRect(16, 16, 260, 68, 12);
    marco.lineStyle(3, 0xfacc15, 1);
    marco.strokeRoundedRect(16, 16, 260, 68, 12);

    textoPuntos = this.add.text(28, 22, 'PTS: 0000', { 
        fontSize: '18px', 
        fill: '#ffe600',
        fontFamily: 'Arial Black',
        shadow: { offsetX: 2, offsetY: 2, color: '#000000', blur: 3, fill: true }
    });

    textoBest = this.add.text(150, 22, 'BEST: ' + highScore.toString().padStart(4, '0'), { 
        fontSize: '13px', 
        fill: '#38bdf8',
        fontStyle: 'bold'
    });

    textoNivel = this.add.text(28, 52, 'VEL: x1.0', { 
        fontSize: '12px', 
        fill: '#a855f7',
        fontStyle: 'bold'
    });

    textoCopas = this.add.text(150, 52, '🏆 0/5', { 
        fontSize: '12px', 
        fill: '#eab308',
        fontStyle: 'bold'
    });

    // Texto de SUPERCUCU arriba (Oculto por defecto)
    textoSuperCucu = this.add.text(GAME_WIDTH / 2, 105, '¡¡SUPERCUCU!!', {
        fontSize: '32px',
        fill: '#facc15',
        fontFamily: 'Arial Black',
        stroke: '#000000',
        strokeThickness: 6,
        shadow: { offsetX: 0, offsetY: 4, color: '#dc2626', blur: 10, fill: true }
    }).setOrigin(0.5).setDepth(20).setVisible(false);
}

function update() {
    if (gameOver) return;

    if (modoFiesta) {
        cucurella.setTint(Phaser.Math.Between(0x00ffff, 0xffffff));
    } else if (cucurella.body.touching.down) {
        cucurella.angle = Math.sin(this.time.now / 60) * 4;
    } else {
        cucurella.angle = 0;
    }

    if (modoFiesta) {
        lucesFiesta.clear();
        let colorF = [0xff0055, 0x00ffff, 0xffe600, 0xa855f7][Math.floor(Math.random() * 4)];
        lucesFiesta.fillStyle(colorF, 0.18);
        lucesFiesta.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    }

    // Movimiento Obstáculos
    obstaculos.getChildren().forEach(function (obs) {
        obs.body.setVelocityX(-velocidadObstaculos);
        if (obs.x < -60) {
            obs.destroy();
            score += 50;
            actualizarMarcador();
        }
    });

    // Movimiento Coleccionables
    coleccionables.getChildren().forEach(function (c) {
        c.body.setVelocityX(-velocidadColeccionables);
        if (c.x < -60) c.destroy();
    });
}

function incrementarDificultad() {
    if (gameOver) return;

    if (velocidadObstaculos < 550) {
        velocidadObstaculos += 10;
        velocidadColeccionables += 8;
        multiplicadorVelocidad += 0.04;

        if (retrasoSpawns > 1000) {
            retrasoSpawns -= 25;
            timerObstaculos.reset({
                delay: retrasoSpawns,
                callback: crearObstaculo,
                callbackScope: this,
                loop: true
            });
        }
        
        textoNivel.setText('VEL: x' + multiplicadorVelocidad.toFixed(1));
    }
}

function crearObstaculo() {
    if (gameOver) return;
    
    let esRival = Math.random() > 0.45;
    let tipoKey = '';
    let posY = GAME_HEIGHT - 104;

    if (esRival) {
        const peinados = ['calvo', 'rubio', 'tupe', 'rizado'];
        let peinadoRandom = peinados[Math.floor(Math.random() * peinados.length)];
        tipoKey = 'rival_' + peinadoRandom;
    } else {
        tipoKey = 'arbitro';
        posY = GAME_HEIGHT - 106;
    }

    let obs = obstaculos.create(GAME_WIDTH + 40, posY, tipoKey);
    obs.body.setAllowGravity(false);
    obs.body.setImmovable(true);

    if (esRival) {
        obs.body.setSize(30, 52);
        obs.body.setOffset(9, 12);
    } else {
        obs.body.setSize(30, 56);
        obs.body.setOffset(8, 10);
    }
}

function crearColeccionable() {
    if (gameOver) return;

    let rand = Math.random();
    let tipoKey = 'pizza';
    let puntos = 100;

    if (rand > 0.70) {
        tipoKey = 'copa';
        puntos = 500;
    } else if (rand > 0.35) {
        tipoKey = 'cerveza';
        puntos = 200;
    }

    let altura = (tipoKey === 'copa')
        ? Phaser.Math.Between(GAME_HEIGHT - 280, GAME_HEIGHT - 200)
        : Phaser.Math.Between(GAME_HEIGHT - 220, GAME_HEIGHT - 140);

    let c = coleccionables.create(GAME_WIDTH + 40, altura, tipoKey);
    c.body.setAllowGravity(false);
    c.puntosExtra = puntos;
    c.esCopa = (tipoKey === 'copa');
}

function recogerColeccionable(player, item) {
    score += item.puntosExtra;
    AudioFX.item();
    mostrarTextoFlotante('+' + item.puntosExtra, item.x, item.y, this);

    if (item.esCopa && !modoFiesta) {
        contadorCopas++;
        textoCopas.setText('🏆 ' + contadorCopas + '/5');

        if (contadorCopas >= 5) {
            activarModoFiesta(this);
        }
    }

    actualizarMarcador();
    item.destroy();
}

function activarModoFiesta(scene) {
    modoFiesta = true;
    contadorCopas = 0;
    textoCopas.setText('🏆 ¡MAX!');
    lucesFiesta.setVisible(true);
    AudioFX.powerUp();

    // Mostrar rótulo SUPERCUCU flotante
    textoSuperCucu.setVisible(true).setScale(0.2).setAlpha(1);
    
    // Animar la entrada (zoom-in) y levitación constante
    scene.tweens.add({
        targets: textoSuperCucu,
        scaleX: 1,
        scaleY: 1,
        duration: 400,
        ease: 'Back.easeOut',
        onComplete: function() {
            tweenSuperCucu = scene.tweens.add({
                targets: textoSuperCucu,
                y: 115,
                duration: 400,
                yoyo: true,
                loop: -1,
                ease: 'Sine.easeInOut'
            });
        }
    });

    // Duración de 7 segundos
    scene.time.delayedCall(7000, function() {
        modoFiesta = false;
        cucurella.clearTint();
        lucesFiesta.setVisible(false);
        lucesFiesta.clear();
        textoCopas.setText('🏆 0/5');

        // Desvanecer Rótulo SUPERCUCU
        if (tweenSuperCucu) tweenSuperCucu.stop();
        scene.tweens.add({
            targets: textoSuperCucu,
            alpha: 0,
            duration: 300,
            onComplete: () => {
                textoSuperCucu.setVisible(false);
                textoSuperCucu.setY(105);
            }
        });
    });
}

function actualizarMarcador() {
    let stringPuntos = score.toString().padStart(4, '0');
    textoPuntos.setText('PTS: ' + stringPuntos);

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('cucu_highscore', highScore);
        textoBest.setText('BEST: ' + highScore.toString().padStart(4, '0'));
    }
}

function generarEfectoHierba(x, y, scene) {
    for (let i = 0; i < 5; i++) {
        let p = scene.add.image(x, y, 'p_hierba');
        scene.tweens.add({
            targets: p,
            x: x + Phaser.Math.Between(-35, 10),
            y: y + Phaser.Math.Between(-20, -5),
            alpha: 0,
            duration: 300,
            onComplete: () => p.destroy()
        });
    }
}

function mostrarTextoFlotante(str, x, y, scene) {
    let txt = scene.add.text(x, y, str, {
        fontSize: '20px',
        fill: '#facc15',
        fontFamily: 'Arial Black',
        stroke: '#000000',
        strokeThickness: 3
    }).setOrigin(0.5);

    scene.tweens.add({
        targets: txt,
        y: y - 45,
        alpha: 0,
        duration: 700,
        onComplete: () => txt.destroy()
    });
}

function chocar(player, obstaculo) {
    if (modoFiesta) {
        score += 100;
        AudioFX.item();
        mostrarTextoFlotante('¡DESTRUIDO! +100', obstaculo.x, obstaculo.y, this);
        obstaculo.destroy();
        actualizarMarcador();
        return;
    }

    this.physics.pause();
    cucurella.setTint(0xff3333);
    gameOver = true;
    AudioFX.pitido();
    
    let cartel = this.add.graphics();
    cartel.fillStyle(0x0f172a, 0.95);
    cartel.fillRoundedRect(GAME_WIDTH/2 - 140, GAME_HEIGHT/2 - 110, 280, 220, 16);
    cartel.lineStyle(3, 0xef4444, 1);
    cartel.strokeRoundedRect(GAME_WIDTH/2 - 140, GAME_HEIGHT/2 - 110, 280, 220, 16);

    let esNuevoRecord = score >= highScore && score > 0;
    let mensajeRecord = esNuevoRecord ? '\n¡NUEVO RÉCORD!' : '\nRécord: ' + highScore;

    this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 5, '¡TARJETA ROJA!\n\nScore: ' + score + mensajeRecord + '\n\n[Toca para Reiniciar]', {
        fontSize: '18px',
        fill: '#ffffff',
        align: 'center',
        fontStyle: 'bold'
    }).setOrigin(0.5);
}
</script>
