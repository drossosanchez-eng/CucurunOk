<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cucu-Run</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b132b; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial Black', sans-serif; }
        canvas { border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.9); }
    </style>
</head>
<body>

<script>
const GAME_WIDTH = 400;
const GAME_HEIGHT = 700;

const config = {
    type: Phaser.AUTO,
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 2200 }, debug: false }
    },
    scene: { preload: preload, create: create, update: update }
};

const game = new Phaser.Game(config);

let cucurella, suelo, obstaculos, coleccionables;
let timerObstaculos, timerColeccionables, timerDificultad;
let score = 0, highScore = 0, contadorCopas = 0;
let modoFiesta = false, lucesFiesta;

let textoPuntos, textoBest, textoNivel, textoCopas, textoSuperCucu, tweenSuperCucu;
let gameOver = false, juegoIniciado = false;

function obtenerDatos() {
    let d = localStorage.getItem('cucu_user_data');
    if (!d) {
        return { highScore: 0, adsVistosNinja: 0, adsVistosFiesta: 0, esVip: false, skinEquipado: 'cucu_espana' };
    }
    return JSON.parse(d);
}

let datosUsuario = obtenerDatos();

const CATALOGO_SKINS = [
    { id: 'cucu_espana', nombre: 'ESPAÑA', tipo: 'gratis', req: 0, color: '#dc2626', pantalon: '#1e3a8a', franja: '#facc15' },
    { id: 'cucu_getafe', nombre: 'GETAFE', tipo: 'puntos', req: 500, color: '#0284c7', pantalon: '#0284c7', franja: '#facc15' },
    { id: 'cucu_eibar', nombre: 'EIBAR', tipo: 'puntos', req: 1200, color: '#991b1b', pantalon: '#1e3a8a', franja: '#1e3a8a' },
    { id: 'cucu_brighton', nombre: 'BRIGHTON', tipo: 'puntos', req: 2500, color: '#2563eb', pantalon: '#ffffff', franja: '#ffffff' },
    { id: 'cucu_chelsea', nombre: 'CHELSEA', tipo: 'puntos', req: 4500, color: '#1d4ed8', pantalon: '#1d4ed8', franja: '#ffffff' },
    { id: 'cucu_barca', nombre: 'BARÇA', tipo: 'puntos', req: 8000, color: '#7c3aed', pantalon: '#1e3a8a', franja: '#dc2626' },
    { id: 'cucu_ninja', nombre: 'NINJA', tipo: 'anuncios', maxAds: 3, color: '#18181b', pantalon: '#09090b', franja: '#dc2626' },
    { id: 'cucu_fiesta', nombre: 'FIESTA', tipo: 'anuncios', maxAds: 5, color: '#ec4899', pantalon: '#8b5cf6', franja: '#06b6d4' },
    { id: 'cucu_dorado', nombre: 'DORADO VIP', tipo: 'pago', precio: '$0.99', color: '#eab308', pantalon: '#ca8a04', franja: '#ffffff' }
];

let saltosRestantes = 2;
let velocidadObstaculos = 280, velocidadColeccionables = 230, retrasoSpawns = 1650, multiplicadorVelocidad = 1.0;

const AudioFX = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    salto() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
    },
    item() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'triangle'; osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.start(); osc.stop(this.ctx.currentTime + 0.2);
    },
    powerUp() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'square'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start(); osc.stop(this.ctx.currentTime + 0.5);
    },
    pitido() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2800, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
    }
};

function preload() {
    datosUsuario = obtenerDatos();
    highScore = Number(datosUsuario.highScore) || 0;

    CATALOGO_SKINS.forEach(s => {
        let canvasC = this.textures.createCanvas(s.id, 64, 84);
        let ctxC = canvasC.context;

        ctxC.fillStyle = '#1c100b';
        ctxC.beginPath(); ctxC.arc(32, 24, 25, 0, Math.PI * 2); ctxC.fill();
        ctxC.beginPath(); ctxC.arc(12, 32, 16, 0, Math.PI * 2); ctxC.fill();
        ctxC.beginPath(); ctxC.arc(52, 32, 16, 0, Math.PI * 2); ctxC.fill();

        ctxC.fillStyle = '#f3c193'; ctxC.fillRect(20, 22, 24, 22);
        ctxC.fillStyle = '#ffffff'; ctxC.fillRect(24, 28, 6, 6); ctxC.fillRect(34, 28, 6, 6);
        ctxC.fillStyle = '#000000'; ctxC.fillRect(26, 30, 3, 3); ctxC.fillRect(36, 30, 3, 3);
        ctxC.fillStyle = '#1c100b'; ctxC.fillRect(26, 38, 12, 3);

        ctxC.fillStyle = s.color; ctxC.fillRect(16, 44, 32, 22);
        ctxC.fillStyle = s.franja; ctxC.fillRect(16, 44, 4, 22); ctxC.fillRect(44, 44, 4, 22);

        ctxC.fillStyle = s.pantalon; ctxC.fillRect(16, 66, 32, 14);
        ctxC.fillStyle = '#ffffff'; ctxC.fillRect(16, 80, 12, 4); ctxC.fillRect(36, 80, 12, 4);
        canvasC.refresh();
    });

    let canvasA = this.textures.createCanvas('arbitro', 52, 72).context;
    canvasA.fillStyle = '#f5d0a9'; canvasA.beginPath(); canvasA.arc(22, 14, 10, 0, Math.PI * 2); canvasA.fill();
    canvasA.fillStyle = '#0f172a'; canvasA.beginPath(); canvasA.arc(22, 10, 10, Math.PI, Math.PI * 2); canvasA.fill();
    canvasA.fillStyle = '#eab308'; canvasA.fillRect(8, 24, 28, 24);
    canvasA.fillStyle = '#0f172a'; canvasA.fillRect(14, 24, 6, 24); canvasA.fillRect(26, 24, 6, 24);
    canvasA.fillStyle = '#f5d0a9'; canvasA.fillRect(36, 12, 6, 18);
    canvasA.fillStyle = '#dc2626'; canvasA.fillRect(34, 0, 14, 20);
    canvasA.fillStyle = '#0f172a'; canvasA.fillRect(8, 48, 28, 14);
    canvasA.fillStyle = '#ffffff'; canvasA.fillRect(8, 62, 10, 10); canvasA.fillRect(26, 62, 10, 10);
    this.textures.get('arbitro').refresh();

    ['calvo', 'rubio', 'tupe', 'rizado'].forEach(tipo => {
        let ctxR = this.textures.createCanvas('rival_' + tipo, 48, 68).context;
        ctxR.fillStyle = '#f5d0a9'; ctxR.beginPath(); ctxR.arc(24, 14, 11, 0, Math.PI * 2); ctxR.fill();
        if (tipo === 'calvo') { ctxR.fillStyle = '#ffffff'; ctxR.beginPath(); ctxR.arc(20, 9, 3, 0, Math.PI * 2); ctxR.fill(); }
        else if (tipo === 'rubio') { ctxR.fillStyle = '#facc15'; ctxR.beginPath(); ctxR.arc(24, 10, 11, Math.PI, Math.PI * 2); ctxR.fill(); }
        else if (tipo === 'tupe') { ctxR.fillStyle = '#27272a'; ctxR.fillRect(14, 3, 20, 10); }
        else if (tipo === 'rizado') { ctxR.fillStyle = '#78350f'; ctxR.beginPath(); ctxR.arc(16, 9, 7, 0, Math.PI * 2); ctxR.fill(); ctxR.beginPath(); ctxR.arc(24, 7, 7, 0, Math.PI * 2); ctxR.fill(); }
        ctxR.fillStyle = '#ffffff'; ctxR.fillRect(8, 25, 32, 26);
        ctxR.fillStyle = '#0284c7'; ctxR.fillRect(8, 25, 8, 26); ctxR.fillRect(24, 25, 8, 26);
        ctxR.fillStyle = '#0f172a'; ctxR.fillRect(8, 51, 32, 14);
        ctxR.fillStyle = '#ffffff'; ctxR.fillRect(8, 65, 12, 3); ctxR.fillRect(28, 65, 12, 3);
        this.textures.get('rival_' + tipo).refresh();
    });

    let ctxP = this.textures.createCanvas('paella', 44, 44).context;
    ctxP.fillStyle = '#334155'; ctxP.fillRect(2, 18, 40, 8);
    ctxP.fillStyle = '#0f172a'; ctxP.beginPath(); ctxP.arc(22, 22, 18, 0, Math.PI * 2); ctxP.fill();
    ctxP.fillStyle = '#eab308'; ctxP.beginPath(); ctxP.arc(22, 22, 15, 0, Math.PI * 2); ctxP.fill();
    ctxP.fillStyle = '#dc2626'; ctxP.fillRect(16, 14, 5, 5); ctxP.fillRect(24, 22, 5, 5);
    ctxP.fillStyle = '#16a34a'; ctxP.fillRect(22, 16, 4, 4); ctxP.fillRect(14, 24, 4, 4);
    this.textures.get('paella').refresh();

    let ctxCer = this.textures.createCanvas('cerveza', 28, 48).context;
    ctxCer.fillStyle = '#92400e'; ctxCer.fillRect(8, 18, 12, 28); ctxCer.fillRect(11, 4, 6, 14);
    ctxCer.fillStyle = '#dc2626'; ctxCer.fillRect(10, 0, 8, 4);
    ctxCer.fillStyle = '#fef08a'; ctxCer.fillRect(8, 26, 12, 12);
    this.textures.get('cerveza').refresh();

    let ctxCop = this.textures.createCanvas('copa', 36, 50).context;
    ctxCop.fillStyle = '#eab308'; ctxCop.fillRect(8, 40, 20, 8); ctxCop.fillRect(12, 24, 12, 16);
    ctxCop.beginPath(); ctxCop.arc(18, 15, 13, 0, Math.PI * 2); ctxCop.fill();
    ctxCop.fillStyle = '#166534'; ctxCop.fillRect(8, 43, 20, 3);
    this.textures.get('copa').refresh();

    let ctxS = this.textures.createCanvas('suelo', GAME_WIDTH, 70).context;
    ctxS.fillStyle = '#15803d'; ctxS.fillRect(0, 0, GAME_WIDTH, 70);
    ctxS.fillStyle = '#ffffff'; ctxS.fillRect(0, 0, GAME_WIDTH, 6);
    this.textures.get('suelo').refresh();

    let ctxH = this.textures.createCanvas('p_hierba', 6, 6).context;
    ctxH.fillStyle = '#4ade80'; ctxH.fillRect(0, 0, 6, 6);
    this.textures.get('p_hierba').refresh();
}

function create() {
    datosUsuario = obtenerDatos();
    highScore = Number(datosUsuario.highScore) || 0;

    score = 0;
    contadorCopas = 0;
    modoFiesta = false;
    gameOver = false;
    juegoIniciado = false;
    saltosRestantes = 2;
    velocidadObstaculos = 280;
    velocidadColeccionables = 230;
    retrasoSpawns = 1650;
    multiplicadorVelocidad = 1.0;

    let bg = this.add.graphics();
    bg.fillStyle(0x0f172a, 1); bg.fillRect(0, 0, GAME_WIDTH, 180);
    bg.fillStyle(0xfef08a, 0.2);
    bg.fillTriangle(40, 0, 0, 220, 150, 220); bg.fillTriangle(GAME_WIDTH - 40, 0, GAME_WIDTH, 220, GAME_WIDTH - 150, 220);
    bg.fillStyle(0xffffff, 0.9); bg.fillRect(30, 10, 40, 12); bg.fillRect(GAME_WIDTH - 70, 10, 40, 12);

    let coloresPublico = [0xdc2626, 0xef4444, 0xfacc15, 0x1d4ed8, 0xffffff, 0x475569];
    for (let yGrada = 80; yGrada < 220; yGrada += 12) {
        bg.fillStyle(0x334155, 1); bg.fillRect(0, yGrada, GAME_WIDTH, 3);
        for (let xG = 6; xG < GAME_WIDTH; xG += 9) {
            bg.fillStyle(coloresPublico[Math.floor(Math.random() * coloresPublico.length)], 0.85);
            bg.fillRect(xG, yGrada - 7, 6, 7);
            bg.fillStyle(0xf3c193, 0.85); bg.fillRect(xG + 1, yGrada - 10, 4, 3);
        }
    }

    lucesFiesta = this.add.graphics().setDepth(10).setVisible(false);
    bg.fillStyle(0x1e293b, 1); bg.fillRect(0, 215, GAME_WIDTH, 15);
    bg.fillStyle(0x3b82f6, 1); bg.fillRect(0, 220, GAME_WIDTH, 5);

    for (let y = 230; y < GAME_HEIGHT - 70; y += 50) {
        bg.fillStyle((Math.floor(y / 50)) % 2 === 0 ? 0x16a34a : 0x15803d, 1);
        bg.fillRect(0, y, GAME_WIDTH, 50);
    }

    suelo = this.physics.add.staticGroup();
    suelo.create(GAME_WIDTH / 2, GAME_HEIGHT - 35, 'suelo').setDisplaySize(GAME_WIDTH, 70).refreshBody();

    cucurella = this.physics.add.sprite(80, GAME_HEIGHT - 120, datosUsuario.skinEquipado).setVisible(false);
    cucurella.setCollideWorldBounds(true);
    cucurella.body.setSize(30, 62); cucurella.body.setOffset(17, 18);

    this.physics.add.collider(cucurella, suelo, () => { saltosRestantes = 2; });

    obstaculos = this.physics.add.group();
    coleccionables = this.physics.add.group();

    this.physics.add.overlap(cucurella, obstaculos, chocar, null, this);
    this.physics.add.overlap(cucurella, coleccionables, recogerColeccionable, null, this);

    let marco = this.add.graphics();
    marco.fillStyle(0x020617, 0.9); marco.fillRoundedRect(16, 16, 260, 68, 12);
    marco.lineStyle(3, 0xfacc15, 1); marco.strokeRoundedRect(16, 16, 260, 68, 12);

    textoPuntos = this.add.text(28, 22, 'PTS: 0000', { fontSize: '18px', fill: '#ffe600', fontFamily: 'Arial Black' });
    textoBest = this.add.text(150, 22, 'BEST: ' + highScore.toString().padStart(4, '0'), { fontSize: '13px', fill: '#38bdf8', fontStyle: 'bold' });
    textoNivel = this.add.text(28, 52, 'VEL: x1.0', { fontSize: '12px', fill: '#a855f7', fontStyle: 'bold' });
    textoCopas = this.add.text(150, 52, '🏆 0/5', { fontSize: '12px', fill: '#eab308', fontStyle: 'bold' });

    textoSuperCucu = this.add.text(GAME_WIDTH / 2, 105, '¡¡SUPERCUCU!!', {
        fontSize: '32px', fill: '#facc15', fontFamily: 'Arial Black', stroke: '#000000', strokeThickness: 6
    }).setOrigin(0.5).setDepth(20).setVisible(false);

    this.input.on('pointerdown', () => {
        AudioFX.init();
        if (gameOver) return;

        if (juegoIniciado && saltosRestantes > 0) {
            cucurella.setVelocityY(-780);
            saltosRestantes--;
            AudioFX.salto();
            generarEfectoHierba(cucurella.x, cucurella.y + 35, this);
        }
    }, this);

    mostrarTiendaSkins(this);
}

function mostrarTiendaSkins(scene) {
    datosUsuario = obtenerDatos();

    let contenedorMenu = scene.add.container(0, 0).setDepth(30);

    let fondoMenu = scene.add.graphics();
    fondoMenu.fillStyle(0x0f172a, 0.95); fondoMenu.fillRoundedRect(20, 95, 360, 560, 16);
    fondoMenu.lineStyle(4, 0x38bdf8, 1); fondoMenu.strokeRoundedRect(20, 95, 360, 560, 16);
    contenedorMenu.add(fondoMenu);

    let titulo = scene.add.text(GAME_WIDTH / 2, 120, 'ARMARIO CUCU', { fontSize: '24px', fill: '#facc15', fontFamily: 'Arial Black' }).setOrigin(0.5);
    contenedorMenu.add(titulo);

    let yOffset = 165;
    CATALOGO_SKINS.forEach((s, idx) => {
        let desbloqueado = false;
        let estadoTxt = '';

        let userHighScore = Number(datosUsuario.highScore) || 0;

        if (s.tipo === 'gratis') {
            desbloqueado = true; estadoTxt = 'DESBLOQUEADO';
        } else if (s.tipo === 'puntos') {
            desbloqueado = userHighScore >= s.req;
            estadoTxt = desbloqueado ? 'DESBLOQUEADO' : 'REQ: ' + s.req + ' PTS';
        } else if (s.tipo === 'anuncios') {
            let vistos = (s.id === 'cucu_ninja') ? datosUsuario.adsVistosNinja : datosUsuario.adsVistosFiesta;
            desbloqueado = vistos >= s.maxAds;
            estadoTxt = desbloqueado ? 'DESBLOQUEADO' : 'VER AD (' + vistos + '/' + s.maxAds + ')';
        } else if (s.tipo === 'pago') {
            desbloqueado = datosUsuario.esVip;
            estadoTxt = desbloqueado ? 'VIP ACTIVO' : 'COMPRAR ' + s.precio;
        }

        let xCol = (idx % 2 === 0) ? 100 : 280;
        let yRow = yOffset + Math.floor(idx / 2) * 76;

        let imgSkin = scene.add.image(xCol - 30, yRow, s.id).setScale(0.7);
        let nameTxt = scene.add.text(xCol + 10, yRow - 12, s.nombre, { fontSize: '13px', fill: '#ffffff', fontStyle: 'bold' });
        let statusTxt = scene.add.text(xCol + 10, yRow + 6, estadoTxt, {
            fontSize: '10px', fill: desbloqueado ? '#4ade80' : '#f87171', fontStyle: 'bold'
        });

        if (datosUsuario.skinEquipado === s.id) {
            statusTxt.setText('EQUIPADO').setStyle({ fill: '#facc15' });
        }

        let zonaInteractiva = scene.add.zone(xCol, yRow, 160, 60).setInteractive({ useHandCursor: true });

        let intentarSeleccionar = () => {
            if (desbloqueado) {
                datosUsuario.skinEquipado = s.id;
                guardarDatos();
                cucurella.setTexture(s.id).setVisible(true);
                contenedorMenu.destroy();
                iniciarJuego(scene);
            } else if (s.tipo === 'anuncios') {
                simularVerAnuncio(s.id, scene, contenedorMenu);
            } else if (s.tipo === 'pago') {
                simularCompraVip(scene, contenedorMenu);
            }
        };

        zonaInteractiva.on('pointerdown', intentarSeleccionar);

        contenedorMenu.add(imgSkin); contenedorMenu.add(nameTxt); contenedorMenu.add(statusTxt); contenedorMenu.add(zonaInteractiva);
    });

    let btnJugarFondo = scene.add.graphics();
    btnJugarFondo.fillStyle(0x22c55e, 1); btnJugarFondo.fillRoundedRect(GAME_WIDTH / 2 - 120, 585, 240, 50, 12);
    btnJugarFondo.lineStyle(3, 0xffffff, 1); btnJugarFondo.strokeRoundedRect(GAME_WIDTH / 2 - 120, 585, 240, 50, 12);

    let btnJugarTexto = scene.add.text(GAME_WIDTH / 2, 610, '¡JUGAR YA!', {
        fontSize: '22px', fill: '#ffffff', fontFamily: 'Arial Black'
    }).setOrigin(0.5);

    let btnHitbox = scene.add.zone(GAME_WIDTH / 2, 610, 240, 50).setInteractive({ useHandCursor: true });

    btnHitbox.on('pointerdown', () => {
        cucurella.setTexture(datosUsuario.skinEquipado).setVisible(true);
        contenedorMenu.destroy();
        iniciarJuego(scene);
    });

    contenedorMenu.add(btnJugarFondo);
    contenedorMenu.add(btnJugarTexto);
    contenedorMenu.add(btnHitbox);
}

function simularVerAnuncio(skinId, scene, menuViejo) {
    if (skinId === 'cucu_ninja') datosUsuario.adsVistosNinja++;
    if (skinId === 'cucu_fiesta') datosUsuario.adsVistosFiesta++;
    guardarDatos();
    alert('🎬 ¡Anuncio completado con éxito!');
    menuViejo.destroy();
    mostrarTiendaSkins(scene);
}

function simularCompraVip(scene, menuViejo) {
    datosUsuario.esVip = true;
    datosUsuario.skinEquipado = 'cucu_dorado';
    guardarDatos();
    alert('👑 ¡Gracias por tu compra! Skin Dorado VIP activado.');
    menuViejo.destroy();
    cucurella.setTexture('cucu_dorado').setVisible(true);
    iniciarJuego(scene);
}

function guardarDatos() {
    localStorage.setItem('cucu_user_data', JSON.stringify(datosUsuario));
}

function iniciarJuego(scene) {
    if (juegoIniciado) return;
    juegoIniciado = true;
    timerObstaculos = scene.time.addEvent({ delay: retrasoSpawns, callback: crearObstaculo, callbackScope: scene, loop: true });
    timerColeccionables = scene.time.addEvent({ delay: 1900, callback: crearColeccionable, callbackScope: scene, loop: true });
    timerDificultad = scene.time.addEvent({ delay: 9000, callback: incrementarDificultad, callbackScope: scene, loop: true });
}

function update() {
    if (!juegoIniciado || gameOver) return;

    if (modoFiesta) {
        cucurella.setTint(Phaser.Math.Between(0x00ffff, 0xffffff));
        lucesFiesta.clear();
        lucesFiesta.fillStyle([0xff0055, 0x00ffff, 0xffe600, 0xa855f7][Math.floor(Math.random() * 4)], 0.18);
        lucesFiesta.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    } else if (cucurella.body.touching.down) {
        cucurella.angle = Math.sin(this.time.now / 60) * 4;
    } else {
        cucurella.angle = 0;
    }

    obstaculos.getChildren().forEach(obs => {
        obs.body.setVelocityX(-velocidadObstaculos);
        if (obs.x < -60) { obs.destroy(); score += 50; actualizarMarcador(); }
    });

    coleccionables.getChildren().forEach(c => {
        c.body.setVelocityX(-velocidadColeccionables);
        if (c.x < -60) c.destroy();
    });
}

function incrementarDificultad() {
    if (gameOver) return;
    if (velocidadObstaculos < 580) {
        velocidadObstaculos += 12; velocidadColeccionables += 10; multiplicadorVelocidad += 0.05;
        if (retrasoSpawns > 950) {
            retrasoSpawns -= 30;
            timerObstaculos.reset({ delay: retrasoSpawns, callback: crearObstaculo, callbackScope: this, loop: true });
        }
        textoNivel.setText('VEL: x' + multiplicadorVelocidad.toFixed(1));
    }
}

function crearObstaculo() {
    if (gameOver) return;
    let rand = Math.random(), posY = GAME_HEIGHT - 104, tipoKey = 'arbitro';

    if (rand > 0.40) {
        const peinados = ['calvo', 'rubio', 'tupe', 'rizado'];
        tipoKey = 'rival_' + peinados[Math.floor(Math.random() * peinados.length)];
    }

    let obs = obstaculos.create(GAME_WIDTH + 40, posY, tipoKey);
    obs.body.setAllowGravity(false); 
    obs.body.setImmovable(true);
    obs.body.setSize(30, 52); 
    obs.body.setOffset(9, 12);
}

function crearColeccionable() {
    if (gameOver) return;
    let rand = Math.random(), tipoKey = 'paella', puntos = 100;

    if (rand > 0.70) { tipoKey = 'copa'; puntos = 500; }
    else if (rand > 0.35) { tipoKey = 'cerveza'; puntos = 200; }

    let altura = (tipoKey === 'copa')
        ? Phaser.Math.Between(GAME_HEIGHT - 280, GAME_HEIGHT - 200)
        : Phaser.Math.Between(GAME_HEIGHT - 220, GAME_HEIGHT - 140);

    let c = coleccionables.create(GAME_WIDTH + 40, altura, tipoKey);
    c.body.setAllowGravity(false); c.puntosExtra = puntos; c.esCopa = (tipoKey === 'copa');
}

function recogerColeccionable(player, item) {
    score += item.puntosExtra;
    AudioFX.item();
    mostrarTextoFlotante('+' + item.puntosExtra, item.x, item.y, this);

    if (item.esCopa && !modoFiesta) {
        contadorCopas++;
        textoCopas.setText('🏆 ' + contadorCopas + '/5');
        if (contadorCopas >= 5) activarModoFiesta(this);
    }

    actualizarMarcador();
    item.destroy();
}

function activarModoFiesta(scene) {
    modoFiesta = true; contadorCopas = 0; textoCopas.setText('🏆 ¡MAX!');
    lucesFiesta.setVisible(true); AudioFX.powerUp();

    textoSuperCucu.setVisible(true).setScale(0.2).setAlpha(1);
    scene.tweens.add({
        targets: textoSuperCucu, scaleX: 1, scaleY: 1, duration: 400, ease: 'Back.easeOut',
        onComplete: () => {
            tweenSuperCucu = scene.tweens.add({ targets: textoSuperCucu, y: 115, duration: 400, yoyo: true, loop: -1, ease: 'Sine.easeInOut' });
        }
    });

    scene.time.delayedCall(7000, () => {
        modoFiesta = false; cucurella.clearTint(); lucesFiesta.setVisible(false).clear(); textoCopas.setText('🏆 0/5');
        if (tweenSuperCucu) tweenSuperCucu.stop();
        scene.tweens.add({ targets: textoSuperCucu, alpha: 0, duration: 300, onComplete: () => { textoSuperCucu.setVisible(false).setY(105); } });
    });
}

function actualizarMarcador() {
    textoPuntos.setText('PTS: ' + score.toString().padStart(4, '0'));
    if (score > highScore) {
        highScore = score;
        datosUsuario.highScore = highScore;
        guardarDatos();
        textoBest.setText('BEST: ' + highScore.toString().padStart(4, '0'));
    }
}

function generarEfectoHierba(x, y, scene) {
    for (let i = 0; i < 5; i++) {
        let p = scene.add.image(x, y, 'p_hierba');
        scene.tweens.add({ targets: p, x: x + Phaser.Math.Between(-35, 10), y: y + Phaser.Math.Between(-20, -5), alpha: 0, duration: 300, onComplete: () => p.destroy() });
    }
}

function mostrarTextoFlotante(str, x, y, scene) {
    let txt = scene.add.text(x, y, str, { fontSize: '20px', fill: '#facc15', fontFamily: 'Arial Black', stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5);
    scene.tweens.add({ targets: txt, y: y - 45, alpha: 0, duration: 700, onComplete: () => txt.destroy() });
}

function chocar(player, obstaculo) {
    if (modoFiesta) {
        score += 100; AudioFX.item();
        mostrarTextoFlotante('¡DESTRUIDO! +100', obstaculo.x, obstaculo.y, this);
        obstaculo.destroy(); actualizarMarcador(); return;
    }

    if (gameOver) return;

    this.physics.pause();
    cucurella.setTint(0xff3333);
    gameOver = true;
    AudioFX.pitido();

    if (timerObstaculos) timerObstaculos.destroy();
    if (timerColeccionables) timerColeccionables.destroy();
    if (timerDificultad) timerDificultad.destroy();

    let cartel = this.add.graphics().setDepth(40);
    cartel.fillStyle(0x0f172a, 0.95); cartel.fillRoundedRect(GAME_WIDTH/2 - 140, GAME_HEIGHT/2 - 110, 280, 220, 16);
    cartel.lineStyle(3, 0xef4444, 1); cartel.strokeRoundedRect(GAME_WIDTH/2 - 140, GAME_HEIGHT/2 - 110, 280, 220, 16);

    let esNuevoRecord = score >= highScore && score > 0;
    let mensajeRecord = esNuevoRecord ? '\n¡NUEVO RÉCORD!' : '\nRécord: ' + highScore;

    this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 5, '¡TARJETA ROJA!\n\nScore: ' + score + mensajeRecord + '\n\n[Toca para Reiniciar]', {
        fontSize: '18px', fill: '#ffffff', align: 'center', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(41);

    this.time.delayedCall(300, () => {
        this.input.once('pointerdown', () => {
            this.scene.restart();
        });
    });
}
</script>
