<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Penalty Keeper</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071b12;
    color:white;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    width:100%;
    max-width:480px;
    height:100%;
    max-height:900px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(to bottom,
        #071b12 0%,
        #0b3d25 35%,
        #08752e 70%,
        #075b25 100%);
}

/* -------------------------
   PANTALLA INICIAL
------------------------- */

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:20;
}

#startScreen{
    background:
        radial-gradient(circle at 50% 35%,rgba(35,190,91,.25),transparent 35%),
        linear-gradient(160deg,#04140d,#0a4728);
}

.logo{
    font-size:42px;
    font-weight:1000;
    text-align:center;
    line-height:.95;
    letter-spacing:-2px;
    text-shadow:0 5px 0 rgba(0,0,0,.25);
}

.logo span{
    color:#6dff9e;
}

.subtitle{
    margin-top:16px;
    color:#b8d9c4;
    font-size:15px;
}

.startKeeper{
    font-size:105px;
    margin:35px 0 20px;
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));
}

button{
    border:0;
    font-weight:900;
    cursor:pointer;
}

.startButton{
    background:#65f593;
    color:#052313;
    font-size:21px;
    padding:18px 55px;
    border-radius:50px;
    box-shadow:0 7px 0 #27a957;
}

.startButton:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #27a957;
}

.smallInfo{
    margin-top:25px;
    font-size:13px;
    color:#8fbda0;
}

/* -------------------------
   HUD
------------------------- */

#hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:16px;
    display:flex;
    justify-content:space-between;
    z-index:10;
}

.hudBox{
    background:rgba(0,0,0,.3);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:8px 14px;
    text-align:center;
    min-width:85px;
}

.hudLabel{
    font-size:10px;
    text-transform:uppercase;
    color:#a9c8b5;
    font-weight:bold;
}

.hudValue{
    font-size:24px;
    font-weight:1000;
    margin-top:2px;
}

#streakValue{
    color:#71ff9e;
}

/* -------------------------
   CAMPO
------------------------- */

#field{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:72%;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.025) 0,
            rgba(255,255,255,.025) 12%,
            transparent 12%,
            transparent 24%
        ),
        linear-gradient(to bottom,#07943c,#066b2c);
}

/* líneas del campo */

.penaltyArea{
    position:absolute;
    width:76%;
    height:35%;
    left:12%;
    top:20%;
    border:3px solid rgba(255,255,255,.75);
    border-bottom:0;
}

.goalArea{
    position:absolute;
    width:42%;
    height:18%;
    left:29%;
    top:20%;
    border:3px solid rgba(255,255,255,.75);
    border-bottom:0;
}

.penaltySpot{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
    left:50%;
    top:47%;
    transform:translate(-50%,-50%);
}

/* -------------------------
   PORTERÍA
------------------------- */

#goal{
    position:absolute;
    width:74%;
    height:29%;
    top:8%;
    left:13%;
    border:8px solid white;
    border-bottom:10px solid white;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.16) 0,
            rgba(255,255,255,.16) 2px,
            transparent 2px,
            transparent 18px
        ),
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.13) 0,
            rgba(255,255,255,.13) 2px,
            transparent 2px,
            transparent 18px
        ),
        rgba(255,255,255,.04);
    box-shadow:
        0 0 0 3px rgba(0,0,0,.15),
        inset 0 0 30px rgba(0,0,0,.15);
}

/* -------------------------
   PORTERO
------------------------- */

#keeper{
    position:absolute;
    width:80px;
    height:125px;
    left:50%;
    top:25%;
    transform:translateX(-50%);
    z-index:6;
    transition:
        left .28s cubic-bezier(.2,.9,.3,1),
        top .28s cubic-bezier(.2,.9,.3,1),
        transform .28s cubic-bezier(.2,.9,.3,1);
}

.keeperBody{
    position:absolute;
    width:52px;
    height:70px;
    background:#ffcf35;
    border-radius:25px 25px 14px 14px;
    left:14px;
    top:32px;
    box-shadow:0 5px 0 rgba(0,0,0,.2);
}

.keeperHead{
    position:absolute;
    width:43px;
    height:43px;
    background:#d99665;
    border-radius:50%;
    left:19px;
    top:0;
    z-index:2;
}

.keeperHair{
    position:absolute;
    width:43px;
    height:18px;
    background:#351b12;
    border-radius:25px 25px 5px 5px;
    left:19px;
    top:0;
    z-index:3;
}

.arm{
    position:absolute;
    width:18px;
    height:60px;
    background:#ffcf35;
    border-radius:15px;
    top:38px;
}

.arm.left{
    left:0;
    transform:rotate(28deg);
}

.arm.right{
    right:0;
    transform:rotate(-28deg);
}

.glove{
    position:absolute;
    width:25px;
    height:25px;
    background:#f2f2f2;
    border-radius:50%;
    top:83px;
}

.arm.left .glove{
    left:-7px;
}

.arm.right .glove{
    right:-7px;
}

.leg{
    position:absolute;
    width:19px;
    height:50px;
    background:#222;
    border-radius:10px;
    top:95px;
}

.leg.left{
    left:21px;
}

.leg.right{
    right:21px;
}

/* -------------------------
   BALÓN
------------------------- */

#ball{
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    background:white;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    z-index:8;
    box-shadow:0 4px 7px rgba(0,0,0,.35);
    transition:none;
}

#ball:after{
    content:"⚽";
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
}

/* -------------------------
   LANZADOR
------------------------- */

#shooter{
    position:absolute;
    left:50%;
    bottom:7%;
    transform:translateX(-50%);
    font-size:62px;
    z-index:5;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));
}

.shooterName{
    position:absolute;
    bottom:2%;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.35);
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

/* -------------------------
   INDICACIONES
------------------------- */

#instruction{
    position:absolute;
    bottom:3%;
    left:50%;
    transform:translateX(-50%);
    z-index:12;
    background:rgba(0,0,0,.48);
    padding:9px 18px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    text-align:center;
}

/* -------------------------
   RESULTADO
------------------------- */

#message{
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%) scale(.7);
    z-index:30;
    opacity:0;
    pointer-events:none;
    text-align:center;
    font-size:42px;
    font-weight:1000;
    text-shadow:0 5px 0 rgba(0,0,0,.35);
    white-space:nowrap;
    transition:.25s;
}

#message.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* -------------------------
   GAME OVER
------------------------- */

#gameOver{
    background:rgba(2,12,8,.94);
    z-index:50;
    display:none;
}

.overTitle{
    font-size:38px;
    font-weight:1000;
}

.overScore{
    margin-top:15px;
    font-size:21px;
    color:#b8d9c4;
}

.bigScore{
    font-size:80px;
    font-weight:1000;
    color:#6dff9e;
    margin:5px 0 25px;
}

.newRecord{
    color:#ffd43b;
    font-size:18px;
    font-weight:900;
    margin-bottom:20px;
}

.restartButton{
    background:#65f593;
    color:#052313;
    padding:16px 40px;
    border-radius:40px;
    font-size:19px;
}

/* -------------------------
   EFECTOS
------------------------- */

.shake{
    animation:shake .35s;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
}

.goalFlash{
    animation:flash .35s;
}

@keyframes flash{
    0%{filter:brightness(1)}
    50%{filter:brightness(2)}
    100%{filter:brightness(1)}
}

.ballSave{
    animation:save .3s forwards;
}

@keyframes save{
    50%{
        transform:translate(-50%,-50%) scale(1.3);
    }
}

.hidden{
    display:none!important;
}

/* -------------------------
   BOTONES DE CONTROL
------------------------- */

#controls{
    position:absolute;
    bottom:10%;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:12px;
    z-index:15;
}

.control{
    width:75px;
    height:55px;
    border-radius:18px;
    background:rgba(255,255,255,.13);
    border:2px solid rgba(255,255,255,.25);
    color:white;
    font-size:24px;
    backdrop-filter:blur(5px);
}

.control:active{
    background:rgba(255,255,255,.3);
    transform:scale(.95);
}

@media(max-height:700px){
    #goal{
        height:27%;
    }

    #keeper{
        transform:translateX(-50%) scale(.85);
    }

    .logo{
        font-size:36px;
    }

    .startKeeper{
        margin:20px 0;
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- PANTALLA INICIAL -->
    <div id="startScreen" class="screen">

        <div class="logo">
            PENALTY<br>
            <span>KEEPER</span>
        </div>

        <div class="startKeeper">🧤</div>

        <div class="subtitle">
            ¿Cuántos penaltis puedes parar?
        </div>

        <button class="startButton" onclick="startGame()">
            ⚽ EMPEZAR
        </button>

        <div class="smallInfo">
            Récord: <span id="startBest">0</span>
        </div>

    </div>


    <!-- HUD -->
    <div id="hud" class="hidden">

        <div class="hudBox">
            <div class="hudLabel">Racha</div>
            <div class="hudValue" id="streakValue">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">Récord</div>
            <div class="hudValue" id="bestValue">0</div>
        </div>

    </div>


    <!-- CAMPO -->
    <div id="field" class="hidden">

        <div id="goal">

            <div id="keeper">

                <div class="keeperHead"></div>
                <div class="keeperHair"></div>

                <div class="arm left">
                    <div class="glove"></div>
                </div>

                <div class="arm right">
                    <div class="glove"></div>
                </div>

                <div class="keeperBody"></div>

                <div class="leg left"></div>
                <div class="leg right"></div>

            </div>

        </div>

        <div class="penaltyArea"></div>
        <div class="goalArea"></div>
        <div class="penaltySpot"></div>

        <div id="ball"></div>

        <div id="shooter">🧑🏻</div>
        <div class="shooterName" id="shooterName">
            JUGADOR
        </div>

    </div>


    <!-- CONTROLES -->
    <div id="controls" class="hidden">

        <button class="control" onclick="chooseDirection('left')">
            ⬅️
        </button>

        <button class="control" onclick="chooseDirection('center')">
            ⬆️
        </button>

        <button class="control" onclick="chooseDirection('right')">
            ➡️
        </button>

    </div>


    <div id="instruction" class="hidden">
        ¿Dónde crees que irá?
    </div>


    <div id="message"></div>


    <!-- GAME OVER -->
    <div id="gameOver" class="screen">

        <div class="overTitle">
            ⚽ ¡GOL!
        </div>

        <div class="overScore">
            Has parado
        </div>

        <div class="bigScore" id="finalScore">
            0
        </div>

        <div class="overScore">
            penaltis consecutivos
        </div>

        <div class="newRecord hidden" id="newRecord">
            🏆 ¡NUEVO RÉCORD!
        </div>

        <button class="restartButton" onclick="startGame()">
            🔄 VOLVER A JUGAR
        </button>

    </div>

</div>


<script>

/* ==========================================
   VARIABLES
========================================== */

let streak = 0;

let best = Number(localStorage.getItem("penaltyBest")) || 0;

let acceptingInput = false;

let currentDirection = null;

let touchStartX = 0;
let touchStartY = 0;

const directions = ["left","center","right"];

const shooters = [
    "🧑🏻",
    "🧑🏼",
    "🧑🏽",
    "🧑🏾",
    "🧑🏼‍🦱",
    "🧑🏽‍🦱",
    "🧔🏻",
    "🧔🏽"
];

const names = [
    "EL NOVATO",
    "EL ESPECIALISTA",
    "EL FRANCOTIRADOR",
    "EL MISTERIOSO",
    "EL MATADOR",
    "EL TRICKSTER",
    "EL CRACK",
    "EL REY DEL PENALTI"
];


/* ==========================================
   ELEMENTOS
========================================== */

const startScreen = document.getElementById("startScreen");
const field = document.getElementById("field");
const hud = document.getElementById("hud");
const controls = document.getElementById("controls");
const instruction = document.getElementById("instruction");
const gameOver = document.getElementById("gameOver");

const keeper = document.getElementById("keeper");
const ball = document.getElementById("ball");

const streakValue = document.getElementById("streakValue");
const bestValue = document.getElementById("bestValue");

const message = document.getElementById("message");

const shooter = document.getElementById("shooter");
const shooterName = document.getElementById("shooterName");

document.getElementById("startBest").textContent = best;


/* ==========================================
   EMPEZAR
========================================== */

function startGame(){

    streak = 0;

    acceptingInput = false;

    updateHUD();

    startScreen.classList.add("hidden");

    gameOver.style.display = "none";

    field.classList.remove("hidden");
    hud.classList.remove("hidden");
    controls.classList.remove("hidden");
    instruction.classList.remove("hidden");

    resetKeeper();

    setShooter();

    setTimeout(() => {

        preparePenalty();

    },500);
}


/* ==========================================
   HUD
========================================== */

function updateHUD(){

    streakValue.textContent = streak;
    bestValue.textContent = best;

}


/* ==========================================
   PREPARAR PENALTI
========================================== */

function preparePenalty(){

    acceptingInput = true;

    resetKeeper();

    ball.style.transition = "none";

    ball.style.left = "50%";
    ball.style.top = "58%";

    ball.classList.remove("ballSave");

    message.classList.remove("show");

    setShooter();

    /*
       Aquí está una de las claves del juego.

       El lanzamiento NO es completamente aleatorio.

       A medida que aumenta la racha,
       el lanzador se vuelve más difícil.
    */

    currentDirection = calculateShot();

}


/* ==========================================
   CALCULAR LANZAMIENTO
========================================== */

function calculateShot(){

    let difficulty = Math.min(streak / 30,1);

    /*
       Al principio:
       - izquierda 35%
       - centro 30%
       - derecha 35%

       Más adelante introducimos
       comportamientos menos previsibles.
    */

    let r = Math.random();

    if(r < 0.35){
        return "left";
    }

    if(r < 0.65){
        return "center";
    }

    return "right";

}


/* ==========================================
   CAMBIAR LANZADOR
========================================== */

function setShooter(){

    let index = Math.floor(Math.random() * shooters.length);

    shooter.textContent = shooters[index];

    let nameIndex = Math.floor(Math.random() * names.length);

    shooterName.textContent = names[nameIndex];

}


/* ==========================================
   ELEGIR DIRECCIÓN
========================================== */

function chooseDirection(direction){

    if(!acceptingInput) return;

    acceptingInput = false;

    kickBall(currentDirection);

    setTimeout(() => {

        if(direction === currentDirection){

            savePenalty();

        }else{

            goalScored();

        }

    },420);

}


/* ==========================================
   LANZAMIENTO
========================================== */

function kickBall(direction){

    let targetLeft = "50%";

    if(direction === "left"){
        targetLeft = "22%";
    }

    if(direction === "right"){
        targetLeft = "78%";
    }

    let targetTop = "27%";

    if(direction === "center"){
        targetLeft = "50%";
        targetTop = "28%";
    }

    ball.style.transition =
        "left .42s cubic-bezier(.2,.8,.3,1), top .42s ease, transform .42s ease";

    ball.style.left = targetLeft;
    ball.style.top = targetTop;

    ball.style.transform =
        "translate(-50%,-50%) scale(.75)";

}


/* ==========================================
   PARADA
========================================== */

function savePenalty(){

    streak++;

    if(streak > best){

        best = streak;

        localStorage.setItem(
            "penaltyBest",
            best
        );

    }

    updateHUD();

    keeper.style.transition =
        "left .28s cubic-bezier(.2,.9,.3,1), transform .28s";

    if(currentDirection === "left"){

        keeper.style.left = "20%";
        keeper.style.transform =
            "translateX(-50%) rotate(-25deg)";

    }

    if(currentDirection === "right"){

        keeper.style.left = "80%";
        keeper.style.transform =
            "translateX(-50%) rotate(25deg)";

    }

    if(currentDirection === "center"){

        keeper.style.left = "50%";
        keeper.style.transform =
            "translateX(-50%) scale(1.1)";

    }

    ball.classList.add("ballSave");

    showMessage(
        getSaveMessage(),
        true
    );

    if(navigator.vibrate){

        navigator.vibrate(50);

    }

    setTimeout(() => {

        preparePenalty();

    },900);

}


/* ==========================================
   MENSAJES
========================================== */

function getSaveMessage(){

    if(streak >= 30){
        return "👑 ¡LEYENDA!";
    }

    if(streak >= 20){
        return "🔥 ¡IMPARABLE!";
    }

    if(streak >= 10){
        return "🧤 ¡PARADÓN!";
    }

    if(streak >= 5){
        return "🔥 ¡GRAN PARADA!";
    }

    return "🧤 ¡PARADA!";

}


/* ==========================================
   GOL
========================================== */

function goalScored(){

    showMessage(
        "⚽ ¡GOL!",
        false
    );

    field.classList.add("shake");

    if(navigator.vibrate){

        navigator.vibrate([80,40,80]);

    }

    setTimeout(() => {

        field.classList.remove("shake");

        endGame();

    },800);

}


/* ==========================================
   MENSAJE
========================================== */

function showMessage(text,success){

    message.textContent = text;

    message.style.color =
        success ? "#6dff9e" : "#ff6464";

    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");

}


/* ==========================================
   FINAL
========================================== */

function endGame(){

    acceptingInput = false;

    document.getElementById("finalScore").textContent =
        streak;

    if(streak === best && streak > 0){

        document.getElementById("newRecord")
            .classList.remove("hidden");

    }else{

        document.getElementById("newRecord")
            .classList.add("hidden");

    }

    gameOver.style.display = "flex";

}


/* ==========================================
   RESET PORTERO
========================================== */

function resetKeeper(){

    keeper.style.transition = "none";

    keeper.style.left = "50%";

    keeper.style.top = "25%";

    keeper.style.transform =
        "translateX(-50%)";

}


/* ==========================================
   CONTROL POR DESLIZAMIENTO
========================================== */

document.addEventListener(
    "touchstart",
    function(e){

        if(!acceptingInput) return;

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    function(e){

        if(!acceptingInput) return;

        let endX = e.changedTouches[0].clientX;
        let endY = e.changedTouches[0].clientY;

        let dx = endX - touchStartX;
        let dy = endY - touchStartY;

        /*
           Si el movimiento es pequeño,
           utilizamos la posición donde
           tocó el usuario.
        */

        if(Math.abs(dx) < 25 && Math.abs(dy) < 25){

            let width = window.innerWidth;

            if(endX < width / 3){

                chooseDirection("left");

            }else if(endX > width * 2 / 3){

                chooseDirection("right");

            }else{

                chooseDirection("center");

            }

            return;
        }

        /*
           Si desliza:
           izquierda / derecha / arriba
        */

        if(Math.abs(dx) > Math.abs(dy)){

            if(dx < 0){

                chooseDirection("left");

            }else{

                chooseDirection("right");

            }

        }else{

            chooseDirection("center");

        }

    },
    {passive:true}
);


/* ==========================================
   TECLADO
========================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft"){

            chooseDirection("left");

        }

        if(e.key === "ArrowUp"){

            chooseDirection("center");

        }

        if(e.key === "ArrowRight"){

            chooseDirection("right");

        }

    }
);

</script>

</body>
</html>
